name: Build Squirrel

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: Build
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install ATL via Chocolatey
        shell: pwsh
        run: |
          Write-Host "Installing Visual C++ ATL for x86 and x64..."

          # Install ATL components to the existing VS 2022 Enterprise installation
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.ATL --add Microsoft.VisualStudio.Component.VC.ATLMFC --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --includeRecommended --installPath 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'" -y

          Write-Host "Waiting for installation to complete..."
          Start-Sleep -Seconds 90

          # List what VS components are installed
          Write-Host "`nChecking installed VS components..."
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all -products *

          # Try to find ATL headers
          Write-Host "`nSearching for ATL headers..."
          $atlFound = Get-ChildItem -Path "C:\Program Files*" -Filter "atlbase.h" -Recurse -ErrorAction SilentlyContinue

          if ($atlFound) {
            foreach ($file in $atlFound) {
              Write-Host "✓ ATL headers found at: $($file.FullName)"
            }
          } else {
            Write-Host "✗ Warning: ATL headers not found!"
            exit 1
          }

          # Verify the Enterprise installation has ATL
          $enterprisePath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          if (Test-Path $enterprisePath) {
            Write-Host "`nVC Tools versions in Enterprise:"
            Get-ChildItem $enterprisePath | ForEach-Object {
              $atlPath = Join-Path $_.FullName "atlmfc\include\atlbase.h"
              if (Test-Path $atlPath) {
                Write-Host "  ✓ $($_.Name) has ATL"
              } else {
                Write-Host "  ✗ $($_.Name) missing ATL"
              }
            }
          }

      - name: Build Squirrel
        shell: cmd
        run: ./src/build_official.cmd

      - name: Test Squirrel
        shell: cmd
        run: ./test/test_official.cmd

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: build/artifacts/
