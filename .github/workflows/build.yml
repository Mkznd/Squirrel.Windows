name: Build Squirrel

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: Build
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install ATL via Chocolatey
        shell: pwsh
        run: |
          Write-Host "Installing Visual C++ ATL for x86 and x64..."

          # Install via VS Build Tools using chocolatey
          choco install visualstudio2022-workload-vctools --package-parameters "--add Microsoft.VisualStudio.Component.VC.ATL --add Microsoft.VisualStudio.Component.VC.ATLMFC --includeRecommended" -y

          Write-Host "Waiting for installation to complete..."
          Start-Sleep -Seconds 60

          # List what VS components are installed
          Write-Host "`nChecking installed VS components..."
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all

          # Try to find ATL headers
          Write-Host "`nSearching for ATL headers..."
          $atlPaths = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\atlmfc\include\atlbase.h",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\*\atlmfc\include\atlbase.h",
            "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\atlmfc\include\atlbase.h"
          )

          $found = $false
          foreach ($path in $atlPaths) {
            if (Test-Path $path) {
              $resolved = Resolve-Path $path
              Write-Host "✓ ATL headers found at: $resolved"
              $found = $true
              break
            }
          }

          if (-not $found) {
            Write-Host "✗ Warning: ATL headers not found in expected locations!"
            Write-Host "Searching entire VC directory..."
            Get-ChildItem -Path "C:\Program Files*" -Filter "atlbase.h" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          }

      - name: Build Squirrel
        shell: cmd
        run: ./src/build_official.cmd

      - name: Test Squirrel
        shell: cmd
        run: ./test/test_official.cmd

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: build/artifacts/
