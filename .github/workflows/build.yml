name: Build Squirrel

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: Build
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Install Visual Studio components
        shell: pwsh
        run: |
          Write-Host "Installing ATL components..."
          $vsInstallerPath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          # Install both ATL and ATL for latest build tools (with support for v142 build tools)
          & $vsInstallerPath modify `
            --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            --add Microsoft.VisualStudio.Component.VC.ATL `
            --add Microsoft.VisualStudio.Component.VC.ATL.ARM64 `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC `
            --quiet --norestart --wait

          Write-Host "Waiting for VS installation to complete..."
          Start-Sleep -Seconds 30

          # Verify ATL installation
          $atlPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\atlmfc\include\atlbase.h"
          if (Test-Path $atlPath) {
            Write-Host "ATL headers found at: $(Resolve-Path $atlPath)"
          } else {
            Write-Host "Warning: ATL headers not found!"
          }

      - name: Build Squirrel
        shell: cmd
        run: ./src/build_official.cmd

      - name: Test Squirrel
        shell: cmd
        run: ./test/test_official.cmd

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: build/artifacts/
