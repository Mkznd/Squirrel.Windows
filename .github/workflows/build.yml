name: Build Squirrel

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: Build
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install ATL via VS Installer
        shell: pwsh
        run: |
          Write-Host "Finding Visual Studio installation..."
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS Installation Path: $vsPath"

          Write-Host "`nInstalling ATL components..."
          $installerPath = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"

          # Use vs_installer to modify the existing installation
          $process = Start-Process -FilePath $installerPath -ArgumentList "modify", "--installPath", "`"$vsPath`"", "--add", "Microsoft.VisualStudio.Component.VC.ATL", "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC", "--add", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64", "--quiet", "--norestart" -Wait -PassThru -NoNewWindow

          Write-Host "Installer exit code: $($process.ExitCode)"

          Write-Host "`nWaiting for installation to complete..."
          Start-Sleep -Seconds 60

          # Verify ATL installation in the detected VS path
          $vcToolsPath = Join-Path $vsPath "VC\Tools\MSVC"
          if (Test-Path $vcToolsPath) {
            Write-Host "`nVC Tools versions found:"
            Get-ChildItem $vcToolsPath | ForEach-Object {
              $atlPath = Join-Path $_.FullName "atlmfc\include\atlbase.h"
              if (Test-Path $atlPath) {
                Write-Host "  ✓ $($_.Name) has ATL at: $atlPath"
              } else {
                Write-Host "  ✗ $($_.Name) missing ATL"
              }
            }
          } else {
            Write-Host "✗ Warning: VC Tools path not found at $vcToolsPath"
            exit 1
          }

          # Double-check: Search for all atlbase.h files
          Write-Host "`nAll ATL header locations:"
          Get-ChildItem -Path "C:\Program Files*" -Filter "atlbase.h" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  Found: $($_.FullName)"
          }

      - name: Build Squirrel
        shell: cmd
        run: ./src/build_official.cmd

      - name: Test Squirrel
        shell: cmd
        run: ./test/test_official.cmd

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: build/artifacts/
